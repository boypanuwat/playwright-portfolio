name: Playwright CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  qa-practice:
    name: Lint, Typecheck, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TARGET_ENV: production
      QA_PRACTICE_EMAIL: ${{ secrets.QA_PRACTICE_EMAIL || 'admin@admin.com' }}
      QA_PRACTICE_PASSWORD: ${{ secrets.QA_PRACTICE_PASSWORD || 'admin123' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run qa-practice smoke tests
        run: pnpm test:qa-practice --grep "@smoke"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
